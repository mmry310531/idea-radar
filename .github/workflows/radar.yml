name: radar

on:
  schedule:
    # UTC 週一 16:17 = 台北週二 00:17
    # 比 Claude 的研究輪（台北週二 03:00）早約 3 小時，GitHub 的排程常延遲，留緩衝。
    # 分鐘刻意不用 :00，整點是全世界排程擠在一起的時候，最容易被延遲或跳過。
    - cron: "17 16 * * 1"
  workflow_dispatch:        # Actions 頁面上的「Run workflow」按鈕，手動跑一次

permissions:
  contents: write           # 讓它能把 state.json 與 out/ 提交回 repo

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei       # 讓摘要檔名的日期是台灣日期
      MAIL_USER: ${{ secrets.MAIL_USER }}   # 放在 job 層，下面的 if 才讀得到
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: run radar
        id: radar
        run: python radar.py --out out

      - name: commit results
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A out state.json sources.json
          git diff --staged --quiet || git commit -m "radar $(date +%F)"
          git push

      # 寄一份摘要到信箱，讓 Claude 每週的研究輪用 Gmail 讀到（repo 保持私人）。
      # 沒設 MAIL_USER / MAIL_APP_PASSWORD 這兩個 secret 就自動跳過，不會報錯。
      - name: email digest
        if: env.MAIL_USER != ''
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          DIGEST: ${{ steps.radar.outputs.digest }}
          FAILED: ${{ steps.radar.outputs.failed }}
        run: |
          python - <<'PY'
          import os, smtplib, datetime
          from email.mime.text import MIMEText
          body = open(os.environ["DIGEST"], encoding="utf-8").read()
          tag = "" if os.environ.get("FAILED", "0") == "0" else f" ⚠{os.environ['FAILED']} 個來源失敗"
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = f"[idea-radar] 法規雷達摘要 {datetime.date.today()}{tag}"
          msg["From"] = msg["To"] = os.environ["MAIL_USER"]
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["MAIL_USER"], os.environ["MAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("sent")
          PY
