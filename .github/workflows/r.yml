name: r
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "17 16 * * 1"
  workflow_dispatch:
    inputs:
      m:
        default: y
permissions:
  contents: write
concurrency:
  group: r
  cancel-in-progress: false
jobs:
  j:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
      M: ${{ (github.event.schedule == '17 16 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.m != 'x')) && 'y' || 'x' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python r.py -$M > /dev/null
      - run: |
          git config user.name u
          git config user.email u@users.noreply.github.com
          git add c.dat s.dat e
          git diff --staged --quiet || git commit -qm u
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
